name: flask_application_pipeline_!
on: 
  push:
    branches:
      - main
jobs:
  python_flask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setting up python in runner
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip intall -r requirements.txt
      - name: running flask app
        run: python app.py
        
      - name: setting up test case
        run: |
          echo "strating the test using curl command"
          curl http://127.0.0.1:5000
          echo "testing has been completed"
        
        
    
  
